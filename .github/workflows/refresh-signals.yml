name: Refresh Ajiu trend signals

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out this feed repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download TrendRadar
        run: git clone --depth 1 https://github.com/wosyuan18/trendradar.git /tmp/trendradar

      - name: Install TrendRadar
        run: python -m pip install --upgrade pip && pip install -r /tmp/trendradar/requirements.txt

      - name: Keep only Douyin and Weibo
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path('/tmp/trendradar/config/config.yaml')
          config = yaml.safe_load(path.read_text(encoding='utf-8'))
          config['platforms'] = [
              {'id': 'douyin', 'name': '抖音热榜'},
              {'id': 'weibo', 'name': '微博热搜'},
          ]
          config['rss']['enabled'] = False
          config['notification']['enabled'] = False
          config['storage']['backend'] = 'local'
          config['storage']['formats']['sqlite'] = True
          config['storage']['formats']['html'] = False
          config['storage']['formats']['txt'] = False
          config['storage']['local']['data_dir'] = 'output'
          config['report']['mode'] = 'current'
          config['report']['display_mode'] = 'platform'
          path.write_text(
              yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
              encoding='utf-8',
          )
          PY

      - name: Collect current rankings
        working-directory: /tmp/trendradar
        run: python -m trendradar

      - name: Export a small public feed for Ajiu Topic Radar
        run: python scripts/export_signals.py /tmp/trendradar/output data/latest.json

      - name: Publish only changed results
        run: |
          git config user.name "Ajiu Topic Radar"
          git config user.email "actions@github.com"
          git add data/latest.json
          git diff --cached --quiet || git commit -m "chore: refresh Douyin and Weibo signals"
          git push
